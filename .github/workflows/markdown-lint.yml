name: markdown
on: [push]

permissions: {}

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: git clone
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: DavidAnson/markdownlint-cli2-action@e3969ef4ed874458f4b66d4631f78fff7717012c # v7
        with:
          globs: "**/*.md"
