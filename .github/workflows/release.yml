name: release
run-name: Release by @${{ github.actor }} from ${{ github.ref_name }}

on: [push]

permissions: {}

jobs:
  release:
    if: ${{ github.ref_type == 'branch' }}
    permissions:
      contents: write
    uses: nextmv-io/release/.github/workflows/release.yml@55db7c4e696ba9b86c9dee55624e9cad41b58b39 # develop
    with:
      BRANCH: ${{ github.ref_name }}
      REPOSITORY: go-highs
      LANGUAGE: go
      PACKAGE_NAME: go-highs
      PACKAGE_LOCATION: ./
      VERSION_FILE: VERSION
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}

  notify:
    needs: [release]
    if: ${{ needs.release.outputs.RELEASE_NEEDED == 'true' && needs.release.outputs.SHOULD_NOTIFY_SLACK == 'true' }}
    permissions: {}
    uses: nextmv-io/release/.github/workflows/notify-slack.yml@55db7c4e696ba9b86c9dee55624e9cad41b58b39 # develop
    with:
      PACKAGE_NAME: go-highs
      VERSION: ${{ needs.release.outputs.VERSION }}
      REPOSITORY: go-highs
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
