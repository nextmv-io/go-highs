name: go
on: [push]

permissions: {}

env:
  GO_VERSION: 1.22.0

jobs:
  # Job for running go linter
  go-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # TODO: only required until making the repo public
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
    steps:
      - name: git clone
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: set up go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # TODO: only required until making the repo public
      - name: allow access to private repos
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null || true
          ssh-add - <<< "${{ secrets.NEXTMVBOT_SSH_KEY }}"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d6238b002a20823d52840fda27e2d4891c5952dc # v4
        with:
          version: v1.56.2
  # Job for running tests
  go-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # TODO: only required until making the repo public
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
    steps:
      - name: git clone
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          lfs: true
          persist-credentials: false
      - name: set up go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # TODO: only required until making the repo public
      - name: allow access to private repos
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null || true
          ssh-add - <<< "${{ secrets.NEXTMVBOT_SSH_KEY }}"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
      - name: go test
        run: go test ./...
